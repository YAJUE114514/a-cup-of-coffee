<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐳 地图编辑器 · a cup of coffee</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <div id="editor-app">
    <header>
      <h1>🐳 a cup of coffee · 地图编辑器</h1>
      <p class="sub">画关卡 → 导出 JSON → 粘贴进 <code>levels.js</code> · 也可以粘贴关卡 JSON 回来继续改</p>
    </header>

    <!-- 关卡信息 -->
    <section class="meta" id="editor-meta">
      <label>ID <input id="meta-id" placeholder="level_01"></label>
      <label>关卡名 <input id="meta-name" placeholder="我的关卡"></label>
      <label>hana 台词 <input id="meta-line" placeholder="……"></label>
    </section>

    <main class="workspace" id="editor-workspace">
      <!-- 工具面板 -->
      <aside class="palette">
        <div class="palette-title">地形</div>
        <div class="palette-buttons" id="tools-terrain"></div>
        <div class="palette-title">检查门要求</div>
        <select id="gate-require"></select>

        <div class="palette-title">物品</div>
        <div class="palette-buttons" id="tools-item"></div>

        <div class="palette-title">玩家</div>
        <div class="palette-buttons" id="tools-player"></div>
        <div class="palette-title">起手</div>
        <select id="hand-select"></select>

        <div class="palette-title">网格尺寸</div>
        <div class="size-inputs">
          <label>宽 <input type="number" id="cols-input" min="4" max="12" value="8"></label>
          <label>高 <input type="number" id="rows-input" min="4" max="12" value="6"></label>
        </div>
      </aside>

      <!-- 画布 -->
      <section class="canvas-wrap">
        <div id="canvas"></div>
      </section>
    </main>

    <!-- 导出区 -->
    <section class="export" id="editor-export">
      <div class="export-tools">
        <button id="btn-test" class="tool-btn test-btn">▶ 测试</button>
        <button id="btn-copy-json">📋 复制 JSON</button>
        <button id="btn-copy-code">📋 复制 Code</button>
        <button id="btn-share-link">🔗 分享链接</button>
        <button id="btn-load">📥 加载关卡</button>
        <button id="btn-clear">🗑 清空</button>
      </div>
      <div id="warnings" class="warnings"></div>
      <textarea id="output" placeholder="导出的 JSON 会显示在这里；粘贴关卡 JSON 后点「加载关卡」可编辑已有关卡……"></textarea>
    </section>

    <!-- 试玩模式 -->
    <section id="test-mode" class="hidden">
      <div class="test-top">
        <span class="test-title">▶ 试玩模式</span>
        <div id="test-hand" class="hud"></div>
      </div>
      <div id="test-board"></div>
      <div class="test-controls">
        <button id="test-exit" class="ghost-btn">← 返回编辑</button>
        <button id="test-reset" class="ghost-btn">↺ 重置</button>
        <span class="control-tip">方向键/WASD 移动 · F 放下 · R 重置 · Esc 返回</span>
      </div>
      <!-- 试玩触屏按键（触屏设备显示） -->
      <div id="test-touch" class="touch-controls hidden">
        <div class="dpad">
          <button class="tbtn t-up"    data-dx="0"  data-dy="-1" aria-label="上">↑</button>
          <button class="tbtn t-left"  data-dx="-1" data-dy="0"  aria-label="左">←</button>
          <button class="tbtn t-down"  data-dx="0"  data-dy="1"  aria-label="下">↓</button>
          <button class="tbtn t-right" data-dx="1"  data-dy="0"  aria-label="右">→</button>
        </div>
        <div class="actions">
          <button class="tbtn t-drop"  data-action="drop"  aria-label="放下">放下</button>
          <button class="tbtn t-undo"  data-action="undo"  aria-label="撤销">撤销</button>
          <button class="tbtn t-reset" data-action="reset" aria-label="重置">重置</button>
        </div>
      </div>
      <p id="test-hana" class="hana-tip hidden"></p>
    </section>
  </div>

  <script type="module" src="js/editor/editor.js"></script>
</body>
</html>
